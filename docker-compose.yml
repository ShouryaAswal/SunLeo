version: '3.8'

services:
  # ---------------------------------------------
  # Frontend Web UI (Streamlit)
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_GATEWAY_URL=http://ytconverter:8000
      - RECOMMENDATION_API_URL=http://recommendation:8001
      - CHATBOT_API_URL=http://chatbot:8002
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/assets:/app/assets
    depends_on:
      ytconverter:
        condition: service_healthy
      recommendation:
        condition: service_healthy
      chatbot:
        condition: service_healthy
    command: streamlit run app/home.py --server.port=8501 --server.address=0.0.0.0

  # ---------------------------------------------
  # Message Broker/Cache (Redis) — reserved for future use
  # ---------------------------------------------
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------------------------------------------
  # Conversion Service Worker (yt-dlp + FFmpeg)
  # ---------------------------------------------
  ytconverter:
    build:
      context: ./backend/ytconverter
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/ytconverter/downloads:/app/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------
  # Recommendation / Discovery Service
  # ---------------------------------------------
  recommendation:
    build:
      context: ./backend/recommendation_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - API_GATEWAY_URL=http://ytconverter:8000
    env_file:
      - .env
    volumes:
      - ./backend/recommendation_service/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      ytconverter:
        condition: service_healthy

  # ---------------------------------------------
  # Chatbot DJ Service (Groq + Firestore)
  # ---------------------------------------------
  chatbot:
    build:
      context: ./backend/chatbot_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - RECOMMENDATION_API_URL=http://recommendation:8001
      - API_GATEWAY_URL=http://ytconverter:8000
      - GOOGLE_APPLICATION_CREDENTIALS=/app/sunleo-d0820-firebase-adminsdk-fbsvc-3f8a4da36d.json
    env_file:
      - .env
    volumes:
      - ./backend/chatbot_service/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      recommendation:
        condition: service_healthy
