version: '3.8'

services:
  # ---------------------------------------------
  # Frontend Web UI (Streamlit)
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      # Use ytconverter container directly as the gateway for now
      - API_GATEWAY_URL=http://localhost:8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./frontend/app:/app/app       # Hot reloading for local development
      - ./frontend/assets:/app/assets
    depends_on:
      # - api-gateway
      # - ytconverter
      - redis
    command: streamlit run app/home.py --server.port=8501 --server.address=0.0.0.0

  # ---------------------------------------------
  # Message Broker/Cache (Redis)
  # Central dependency for async task queues and rate limiting
  # ---------------------------------------------
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # ---------------------------------------------
  # Conversion Service Worker (yt-dlp + FFmpeg)
  # ---------------------------------------------
  ytconverter:
    build:
      context: ./backend/ytconverter
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/ytconverter/downloads:/app/downloads
    depends_on:
      - redis

  # ---------------------------------------------
  # Recommendation / Discovery Service
  # ---------------------------------------------
  recommendation:
    build:
      context: ./backend/recommendation_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
    depends_on:
      - redis

  # ---------------------------------------------
  # Chatbot DJ Service (Groq + LangChain)
  # ---------------------------------------------
  chatbot:
    build:
      context: ./backend/chatbot_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - RECOMMENDATION_API_URL=http://recommendation:8001
      - YTCONVERTER_API_URL=http://ytconverter:8000
    depends_on:
      - redis
      - recommendation
